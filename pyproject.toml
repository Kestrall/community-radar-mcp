[project]
name = "community-radar-mcp"
version = "0.1.0"
description = "MCP server that turns OVHcloud Public Cloud community signals (forum, GitHub, Reddit) into answers, irritant reports and content ideas"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Thomas MARTIN" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "feedparser>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
community-radar = "community_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/community_radar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["community_radar"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"src/community_radar/report.py" = ["E501"]
